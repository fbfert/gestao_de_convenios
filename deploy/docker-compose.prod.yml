# Nome de projeto fixo: sem isto o Compose usa o nome do diretório ("deploy")
# como project name, e como o clinica também roda de uma pasta "deploy/", os
# dois projetos colidem no mesmo namespace — um `--remove-orphans` de um lado
# apaga containers do outro. Já aconteceu em 20/08/2026, ver [[servidor-gestaonossa-virtualmin]].
name: gescon
services:
  gescon-db:
    image: mariadb:11
    container_name: gescon-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: gestao_convenios
      MARIADB_USER: gestao_convenios
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT}
    volumes:
      - gescon_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [gescon]

  gescon-app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: gescon-app:latest
    container_name: gescon-app
    restart: unless-stopped
    depends_on:
      gescon-db:
        condition: service_healthy
    environment:
      DB_HOST: gescon-db
      DB_PORT: "3306"
    volumes:
      - ../api/.env:/var/www/html/.env:ro
      - gescon_storage:/var/www/html/storage
    ports:
      - "127.0.0.1:4105:80"
    networks: [gescon]

  # Automacoes Unimed (Node + Playwright). Sem `ports:` de proposito: so o
  # gescon-app precisa alcanca-lo, e isso acontece pela rede interna em
  # http://gescon-worker:8787. Publicar no host exporia o browser headless.
  gescon-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    image: gescon-worker:latest
    container_name: gescon-worker
    restart: unless-stopped
    environment:
      UNIMED_WORKER_HOST: 0.0.0.0
      UNIMED_WORKER_PORT: "8787"
      UNIMED_WORKER_TOKEN: ${WORKER_TOKEN}
    healthcheck:
      # /health passa pelo mesmo gate de auth do resto da API, entao o
      # healthcheck precisa mandar o Bearer. O token vem do env do proprio
      # container, nunca literal no compose.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health',{headers:{authorization:'Bearer '+process.env.UNIMED_WORKER_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [gescon]

volumes:
  # name: pino explícito para os volumes reais já existentes (criados sob o
  # antigo project name "deploy") — sem isto, mudar `name:` acima criaria
  # volumes novos vazios em vez de reconectar aos dados de produção.
  gescon_db_data:
    name: deploy_gescon_db_data
  gescon_storage:
    name: deploy_gescon_storage

networks:
  gescon:
    name: gescon
