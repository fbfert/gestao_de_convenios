server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.html;

    client_max_body_size 50m;
    charset utf-8;

    # Endpoints servidos pelo Laravel (php-fpm)
    location /api      { try_files $uri $uri/ /index.php?$query_string; }
    location /sanctum  { try_files $uri $uri/ /index.php?$query_string; }
    location /up       { try_files $uri /index.php?$query_string; }

    # Assets do build Vite têm hash no nome (index-XXXX.js): podem ser
    # cacheados para sempre, porque um conteúdo novo sempre vem com um nome
    # novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA React: arquivos estáticos reais primeiro, senão index.html.
    # index.html referencia os assets pelo hash da build atual, então ele
    # nunca pode ficar em cache — senão o navegador continua pedindo um
    # hash antigo que não existe mais depois do próximo deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Bloqueia dotfiles (exceto .well-known)
    location ~ /\.(?!well-known).* { deny all; }
}
