<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Fixture Unimed Gerar Guia</title>
</head>
<body>
  <main id="app"></main>
  <script>
    const params = new URLSearchParams(location.search)
    const scenario = params.get('scenario') || 'success'
    const app = document.querySelector('#app')

    function html(content) {
      app.innerHTML = content
      bind()
    }

    function processing(next) {
      app.insertAdjacentHTML('beforeend', '<div id="processing">Processando, por favor aguarde...</div>')
      setTimeout(() => {
        document.querySelector('#processing')?.remove()
        next()
      }, 20)
    }

    function bind() {
      document.querySelector('#login-form')?.addEventListener('submit', (event) => {
        event.preventDefault()
        processing(showHome)
      })
      document.querySelector('#cadastro_biometria')?.addEventListener('click', abrirPopupNovoExame)
    }

    function showLogin() {
      html(`
        <form id="login-form">
          <input id="login" name="login">
          <input id="passwordTemp" name="passwordTemp" type="password">
          <button name="Button_DoLogin">Entrar</button>
        </form>
      `)
    }

    function showHome() {
      // Na pagina real o <a> tem largura zero: o botao visivel e um filho
      // (.MagnetoBigRoundedButton) renderizado fora da caixa do pai. O clique
      // do worker mira nesse filho, entao o fixture reproduz a mesma estrutura.
      html('<a id="cadastro_biometria" href="#"><div class="MagnetoBigRoundedButton">+ Novo Exame</div></a>')
    }

    // O clique real em "+ Novo Exame" abre uma janela popup (window.open) —
    // todo o fluxo de identificacao do beneficiario e geracao da guia roda
    // dentro dela, nunca na pagina principal.
    function abrirPopupNovoExame(event) {
      event.preventDefault()
      const popup = window.open('about:blank', '_blank')
      popup.document.open()
      popup.document.write(popupHtml(scenario))
      popup.document.close()
    }

    // Gera o HTML completo da popup como string JS (nao como bloco de texto
    // embutido no documento) de proposito: a popup tem sua propria tag de
    // fechamento de script, e um bloco de texto no HTML principal terminaria
    // ali mesmo, antes da hora. Dentro de uma string JS o \/ escapa isso direito.
    function popupHtml(scenarioValue) {
      return `<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Fixture Unimed - Popup Novo Exame</title></head>
<body>
  <main id="app"></main>
  <script>
    const scenario = ${JSON.stringify(scenarioValue)}
    window.__forceUploadFailure = scenario === 'upload-fail'
    const app = document.querySelector('#app')

    function html(content) {
      app.innerHTML = content
      bind()
    }

    function processing(next) {
      app.insertAdjacentHTML('beforeend', '<div id="processing">Processando, por favor aguarde...</div>')
      setTimeout(() => {
        document.querySelector('#processing')?.remove()
        next()
      }, 20)
    }

    function bind() {
      document.querySelector('#ignora-cartao')?.addEventListener('click', (event) => {
        event.preventDefault()
        showCardStart()
      })
      document.querySelectorAll('[data-beneficiary-option]').forEach((el) => {
        el.addEventListener('click', (event) => {
          event.preventDefault()
          if (el.dataset.beneficiaryOption === 'intercambio') {
            showBeneficiaryForm()
          }
        })
      })
      document.querySelector('[name="Button_Insert"]')?.addEventListener('click', () => {
        processing(() => {
          if (scenario === 'restriction') {
            html('<h1>Restrição Administrativa</h1><p>Restrição Administrativa: procurar atendimento presencial.</p>')
          } else if (scenario === 'update') {
            showUpdate()
          } else {
            showSpSadt()
          }
        })
      })
      document.querySelector('[name="Button_Update"]')?.addEventListener('click', () => processing(showSpSadt))
      document.querySelector('[data-action="sp-sadt"]')?.addEventListener('click', showManual)
      document.querySelector('[data-action="solicitacao-manual"]')?.addEventListener('click', showForm)
      document.querySelector('#link_busca_solic')?.addEventListener('click', abrirBuscaPrestador)
      document.querySelector('#link_busca_contrt')?.addEventListener('click', abrirBuscaContratado)
      document.querySelector('[name="CD_ITEM_1"]')?.addEventListener('blur', maybeGenericFields)
      document.querySelector('[name="Button_Finalizar"]')?.addEventListener('click', () => {
        if (scenario === 'uncertain') {
          app.insertAdjacentHTML('beforeend', '<div>Processando, por favor aguarde...</div>')
          return
        }
        // Campo real do portal (achado ao vivo em 26/08/2026): sem
        // preencher, o Finalizar barra com erro de validacao e NAO navega
        // pra confirmacao — mesmo comportamento aqui, pra pegar regressao
        // se o worker parar de preencher.
        const liminar = document.querySelector('[name="FG_LIMINAR_JUDICIAL"]')?.value
        if (!liminar) {
          html('<table><tr><td>O valor do campo Liminar judicial é obrigatório.</td></tr></table>')
          return
        }
        processing(showResult)
      })
    }

    // Tela inicial da popup: "Passe o cartão..." com o link de problemas.
    html('<p>Passe o cartão...</p><a id="ignora-cartao" href="#">Se tiver problemas com o cartão, clique aqui.</a>')

    function showCardStart() {
      // As duas opcoes reais nao tem id, so texto - por isso o worker clica
      // por texto, e o fixture reproduz isso sem id tambem.
      html(\`
        <p>Problemas com o cartão do beneficiário?</p>
        <a href="#" data-beneficiary-option="local">Beneficiário local sem cartão ou cartão não lê. Localize o beneficiário e prossiga com o atendimento.</a>
        <a href="#" data-beneficiary-option="intercambio">Beneficiário de intercâmbio sem cartão. Cadastre o beneficiário e prossiga com o atendimento.</a>
      \`)
    }

    function showBeneficiaryForm() {
      html(\`
        <input id="CD_UNIMED" name="CD_UNIMED">
        <input id="CD_CARTAO" name="CD_CARTAO">
        <input id="CD_BENEF" name="CD_BENEF">
        <input id="CD_DEPEN" name="CD_DEPEN">
        <input id="NR_DV" name="NR_DV">
        <button name="Button_Insert">Verificar</button>
      \`)
    }

    function showUpdate() {
      html('<h1>Atualização cadastral</h1><button name="Button_Update">Atualizar</button>')
    }

    function showSpSadt() {
      // Sem id na pagina real: o worker clica por texto.
      html('<a href="#" data-action="sp-sadt">Digitação de guia SP/SADT</a>')
    }

    function showManual() {
      // Duas opcoes sem id, so texto — igual a tela de beneficiario.
      html(\`
        <a href="#" data-action="guia-ja-autorizada">Digitar a guia manualmente, sem enviar para autorização.</a>
        <a href="#" data-action="solicitacao-manual">Digitar solicitação manualmente e realizar validação para autorizar.</a>
      \`)
    }

    function showForm() {
      html(\`
        <input id="DT_EMISSAO_GUIA" name="DT_EMISSAO_GUIA">
        <select id="FG_ATENDIMENTO_RN" name="FG_ATENDIMENTO_RN"><option value="N">Não</option></select>
        <select id="DM_CARATER_SOLIC" name="DM_CARATER_SOLIC"><option value="1">Eletivo</option></select>
        <select id="DM_TP_ATEND_SADT" name="DM_TP_ATEND_SADT"><option value="03">Outras Terapias</option></select>
        <select id="DM_TP_ACIDENTE" name="DM_TP_ACIDENTE"><option value="9">Não acidente</option></select>
        <select id="FG_LIMINAR_JUDICIAL" name="FG_LIMINAR_JUDICIAL">
          <option value="">Selecione</option>
          <option value="S">Sim</option>
          <option value="N">Não</option>
        </select>
        <textarea id="DS_INDIC_CLINICA" name="DS_INDIC_CLINICA"></textarea>
        <input id="NM_CONTRATADO" name="NM_CONTRATADO" readonly>
        <a href="#" id="link_busca_contrt">Buscar contratado</a>
        <a href="#" id="link_busca_solic">Buscar prestador</a>
        <input id="CD_ITEM_1" name="CD_ITEM_1">
        <input id="NR_QTD_1" name="NR_QTD_1">
        <div id="generic-slot"></div>
        <input type="file" data-tipo="pedido_medico">
        <ul id="uploaded-files"></ul>
        <select id="CD_PROFISSIONAL" name="CD_PROFISSIONAL">
          <option value="">Selecione</option>
          <option value="1234">TERAPEUTA TESTE</option>
        </select>
        <button name="Button_Finalizar">Finalizar e Gerar guia</button>
      \`)
    }

    // A busca de prestador na pagina real abre outra popup propria (com o
    // formulario de CRM/nome dentro dela) — o fixture reproduz isso com
    // window.open em vez de trocar o innerHTML da popup do beneficiario.
    function abrirBuscaPrestador(event) {
      event.preventDefault()
      const popup = window.open('about:blank', '_blank')
      popup.document.title = 'Localizar prestador'
      popup.document.body.innerHTML = \`
        <input id="s_nr_crm" name="s_nr_crm">
        <input id="s_nm_prestador" name="s_nm_prestador">
        <button name="Button_DoSearch">Localizar</button>
        <button id="refazer-pesquisa">Refazer pesquisa</button>
        <table id="provider-results"></table>
      \`
      popup.document.querySelector('[name="Button_DoSearch"]').addEventListener('click', () => runProviderSearchIn(popup))
      popup.document.querySelector('#refazer-pesquisa').addEventListener('click', () => {
        popup.document.querySelector('#provider-results').innerHTML = ''
      })
    }

    // Popup separada da de prestador (solicitante) — busca o CONTRATADO
    // (a clinica em si). No portal real, selecionar so preenche o campo
    // NM_CONTRATADO no formulario ja aberto (sem recarregar/perder os
    // outros campos ja preenchidos), entao aqui so seta o input direto em
    // vez de chamar showForm() de novo.
    function abrirBuscaContratado(event) {
      event.preventDefault()
      const popup = window.open('about:blank', '_blank')
      popup.document.title = 'Localizar prestador'
      popup.document.body.innerHTML = \`
        <input id="s_nm_prestador" name="s_nm_prestador">
        <button name="Button_DoSearch">Localizar</button>
        <table id="contratado-results"></table>
      \`
      popup.document.querySelector('[name="Button_DoSearch"]').addEventListener('click', () => runContratadoSearchIn(popup))
    }

    function runContratadoSearchIn(popupWin) {
      const name = popupWin.document.querySelector('[name="s_nm_prestador"]').value.trim()
      const rows = popupWin.document.querySelector('#contratado-results')
      rows.innerHTML = ''
      if (!name) {
        rows.innerHTML = '<tr><td>Não foram encontrados registros.</td></tr>'
        return
      }

      const tr = popupWin.document.createElement('tr')
      tr.innerHTML = \`<td>\${name}</td><td>OK - Ativo</td>\`
      const td = popupWin.document.createElement('td')
      const btn = popupWin.document.createElement('button')
      btn.type = 'button'
      btn.textContent = 'Selecionar'
      btn.addEventListener('click', () => {
        document.querySelector('#NM_CONTRATADO').value = name
      })
      td.appendChild(btn)
      tr.appendChild(td)
      rows.appendChild(tr)
    }

    function runProviderSearchIn(popupWin) {
      const crm = popupWin.document.querySelector('[name="s_nr_crm"]').value
      const name = popupWin.document.querySelector('[name="s_nm_prestador"]').value.toUpperCase()
      const rows = popupWin.document.querySelector('#provider-results')
      rows.innerHTML = ''

      if (scenario === 'provider-name' && crm) {
        rows.innerHTML = '<tr><td>Não foram encontrados registros.</td></tr>'
        return
      }

      if (scenario === 'provider-fallback' && (crm || !name.includes('NAO COOPERADO'))) {
        rows.innerHTML = '<tr><td>Não foram encontrados registros.</td></tr>'
        return
      }

      const providerName = name.includes('NAO COOPERADO') ? 'MEDICO NAO COOPERADO' : 'DR. CARLOS ALMEIDA'
      const tr = popupWin.document.createElement('tr')
      tr.setAttribute('data-prestador-row', '')
      tr.innerHTML = \`<td>\${providerName}</td><td>OK - Ativo</td>\`
      const td = popupWin.document.createElement('td')
      const btn = popupWin.document.createElement('button')
      btn.type = 'button'
      btn.textContent = 'Selecionar'
      // "window" aqui e a popup do beneficiario/guia (quem abriu a busca),
      // nao a popup de busca — mesma logica do window.opener no site real.
      btn.addEventListener('click', () => {
        window.__providerSelected = providerName
        showForm()
      })
      td.appendChild(btn)
      tr.appendChild(td)
      rows.appendChild(tr)
    }

    function maybeGenericFields() {
      if (scenario !== 'generic') return
      document.querySelector('#generic-slot').innerHTML = \`
        <input id="DS_ITEM_GENERICO_1" name="DS_ITEM_GENERICO_1">
        <input id="VL_ITEM_GENERICO_1" name="VL_ITEM_GENERICO_1">
      \`
    }

    // Reproduz a pagina real de confirmacao (lista_impressao.do): sem
    // id/data-attr nenhum, so uma tabela comum com cabecalho por texto.
    function showResult() {
      // 'protocolo-vazio' reproduz o portal real (achado ao vivo em
      // 26/08/2026, guia 50144044209): protocolo em branco, seguido em
      // outra linha por "Total de registros: 1" — regressao pro bug em que
      // o parser pulava a quebra de linha e capturava essa palavra seguinte
      // como se fosse o protocolo.
      const protocolo = scenario === 'protocolo-vazio' ? '' : 'PROTO-77'
      html(\`
        <p>Operação realizada com sucesso!</p>
        <p>Número do Protocolo de Atendimento: \${protocolo}</p>
        <p>Total de registros:  1</p>
        <table>
          <tr><th>Data Solicitação</th><th>Nº Guia</th><th>Situação</th><th>Tipo</th><th>Senha de Autorização</th><th>Procedimentos</th></tr>
          <tr><td>24/08/2026 19:18</td><td>GUIA-8899</td><td>Autorizado</td><td>SP/SADT</td><td>SENHA-ABC</td><td>50000470 - Qtd: 10 - Qtd Aut: 8</td></tr>
        </table>
      \`)
    }

    bind()
  <\/script>
</body>
</html>`
    }

    showLogin()
  </script>
</body>
</html>
