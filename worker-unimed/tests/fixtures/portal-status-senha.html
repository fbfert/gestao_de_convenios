<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Fixture Unimed Status Senha</title>
</head>
<body>
  <main id="app">
    <form id="login-form">
      <input id="login" name="login">
      <input id="passwordTemp" name="passwordTemp" type="password">
      <button name="Button_DoLogin" type="button">Entrar</button>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(location.search)
    const scenario = params.get('scenario') || 'status-approved'
    const app = document.querySelector('#app')
    let openPage = 1

    document.querySelector('[name="Button_DoLogin"]').addEventListener('click', renderHome)

    function renderHome() {
      app.innerHTML = `
        <a id="cadastro_biometria" href="#"><div class="MagnetoBigRoundedButton">+ Novo Exame</div></a>
        <a id="exames-abertos" href="#">Exames em aberto</a>
      `
      document.querySelector('#cadastro_biometria').addEventListener('click', (event) => {
        event.preventDefault()
        const popup = window.open('about:blank', '_blank')
        popup.document.open()
        popup.document.write(popupHtml(scenario))
        popup.document.close()
      })
      document.querySelector('#exames-abertos').addEventListener('click', (event) => {
        event.preventDefault()
        openPage = 1
        renderOpenExams()
      })
    }

    function renderOpenExams() {
      if (scenario === 'capture-not-found') {
        app.innerHTML = `
          <table><tr data-guia-row><td>OUTRA-999</td><td>Paciente Teste</td></tr></table>
        `
        return
      }

      if (scenario === 'capture-page-2' && openPage === 1) {
        app.innerHTML = `
          <table><tr data-guia-row><td>OUTRA-111</td><td>Paciente Teste</td></tr></table>
          <a data-next-page href="#">Próxima</a>
        `
        document.querySelector('[data-next-page]').addEventListener('click', (event) => {
          event.preventDefault()
          openPage = 2
          renderOpenExams()
        })
        return
      }

      app.innerHTML = `
        <table>
          <tr data-guia-row>
            <td><a href="#" data-open-guide>UNI-123</a></td>
            <td>Paciente Teste</td>
            <td>12345678123456012</td>
          </tr>
        </table>
      `
      document.querySelector('[data-open-guide]').addEventListener('click', (event) => {
        event.preventDefault()
        renderExecution()
      })
    }

    function renderExecution() {
      app.innerHTML = `
        <input id="NR_SENHA" name="NR_SENHA" value="SENHA-321">
        <input id="DT_VALIDADE_SENHA" name="DT_VALIDADE_SENHA" value="15/09/2026">
        <a id="voltar-exames-abertos" href="#">Exames em aberto</a>
      `
      document.querySelector('#voltar-exames-abertos').addEventListener('click', (event) => {
        event.preventDefault()
        renderOpenExams()
      })
    }

    // String JS, nao bloco de texto embutido: a popup tem sua propria tag de
    // fechamento de script, que um bloco de texto no HTML principal fecharia
    // cedo demais. Dentro de uma string JS o \/ escapa isso direito.
    function popupHtml(scenarioValue) {
      return `<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Fixture Unimed - Popup Novo Exame</title></head>
<body>
  <main id="app"></main>
  <script>
    const scenario = ${JSON.stringify(scenarioValue)}
    const app = document.querySelector('#app')

    // Tela inicial da popup: "Passe o cartão..." com o link de problemas.
    renderCardPopup()

    function renderCardPopup() {
      app.innerHTML = '<a id="ignora-cartao" href="#">clique aqui</a>'
      document.querySelector('#ignora-cartao').addEventListener('click', (event) => {
        event.preventDefault()
        renderCardOptions()
      })
    }

    function renderCardOptions() {
      // As duas opcoes reais nao tem id, so texto.
      app.innerHTML = \`
        <a href="#" data-beneficiary-option="local">Beneficiário local sem cartão ou cartão não lê. Localize o beneficiário e prossiga com o atendimento.</a>
        <a href="#" data-beneficiary-option="intercambio">Beneficiário de intercâmbio sem cartão. Cadastre o beneficiário e prossiga com o atendimento.</a>
      \`
      document.querySelector('[data-beneficiary-option="intercambio"]').addEventListener('click', (event) => {
        event.preventDefault()
        renderBeneficiary()
      })
    }

    function renderBeneficiary() {
      app.innerHTML = \`
        <input id="CD_UNIMED" name="CD_UNIMED">
        <input id="CD_CARTAO" name="CD_CARTAO">
        <input id="CD_BENEF" name="CD_BENEF">
        <input id="CD_DEPEN" name="CD_DEPEN">
        <input id="NR_DV" name="NR_DV">
        <button name="Button_Insert" type="button">Verificar</button>
      \`
      document.querySelector('[name="Button_Insert"]').addEventListener('click', renderLocateGuide)
    }

    function renderLocateGuide() {
      if (scenario === 'status-restriction') {
        app.innerHTML = '<p>Restrição Administrativa - procurar atendimento</p>'
        return
      }

      app.innerHTML = '<a id="localizar-guia-link" href="#">Localizar Guia</a>'
      document.querySelector('#localizar-guia-link').addEventListener('click', (event) => {
        event.preventDefault()
        app.innerHTML = \`
          <input id="s_NR_GUIA" name="s_NR_GUIA">
          <button id="localizar-guia" name="Button_DoSearch" type="button">Localizar</button>
        \`
        document.querySelector('#localizar-guia').addEventListener('click', renderGuideStatus)
      })
    }

    function renderGuideStatus() {
      const statusByScenario = {
        'status-approved': 'Autorizado',
        'status-approved-com-quantidades': 'Autorizado',
        'status-under-review': 'Em Análise',
        'status-denied': 'Negado',
        'status-canceled': 'Cancelado',
      }
      const status = statusByScenario[scenario] || 'Autorizado'
      const quantidades = scenario === 'status-approved-com-quantidades'
        ? '<td>Qtd: 10</td><td>Qtd Aut: 6</td>'
        : ''
      app.innerHTML = \`
        <table>
          <tr data-guia-row>
            <td>UNI-123</td>
            <td>Situação: \${status}</td>
            <td>Paciente Teste</td>
            \${quantidades}
          </tr>
        </table>
      \`
    }
  <\/script>
</body>
</html>`
    }
  </script>
</body>
</html>
