<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Fixture Unimed Status Senha</title>
</head>
<body>
  <!--
    Fluxo real confirmado em producao (25/08/2026): login -> tela "Exames em
    aberto" (menu persistente, sempre visivel) -> campo s_nr_guia + botao
    Button_FIltro -> clica na guia encontrada -> tela de execucao SP/SADT com
    DT_AUTORIZACAO / NR_SENHA / DT_VALIDADE_SENHA / QT_SOLIC_1 / QT_AUTORIZADA_1
    ja preenchidos. Nao ha campo "Situacao" separado: autorizado = tem
    DT_AUTORIZACAO + NR_SENHA.
  -->
  <nav id="menu" style="display:none">
    <!-- login() espera este botao ficar visivel para confirmar que autenticou. -->
    <a id="cadastro_biometria" href="#"><div class="MagnetoBigRoundedButton">+ Novo Exame</div></a>
    <a id="exames-abertos" href="#">Exames em aberto</a>
  </nav>
  <main id="app">
    <form id="login-form">
      <input id="login" name="login">
      <input id="passwordTemp" name="passwordTemp" type="password">
      <button name="Button_DoLogin" type="button">Entrar</button>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(location.search)
    const scenario = params.get('scenario') || 'status-approved'
    const app = document.querySelector('#app')
    const menu = document.querySelector('#menu')

    // guia usada pelos testes (ver statusSenha.test.js): "UNI-123".
    const GUIA_EXISTENTE = 'UNI-123'

    const cenarios = {
      'status-approved': { autorizado: true, comQuantidades: false },
      'status-approved-com-quantidades': { autorizado: true, comQuantidades: true },
      'status-em-analise': { autorizado: false, comQuantidades: false },
      // Nem em Exames em aberto, nem via cadastro de beneficiario: caso
      // "genuinamente nao localizavel", GUIA_NOT_FOUND deve continuar valendo.
      'status-nao-encontrada': { naoEncontrada: true, cadastroEncontrada: false },
      // Reproduz o achado ao vivo de 31/08/2026 (guias Negadas de Laura de
      // Faveri/Miguel Ribeiro Machado): some de Exames em aberto mas aparece
      // via cadastro -> Localizar Guia, so que so com o icone (sem texto).
      'status-negada-via-cadastro': {
        naoEncontrada: true,
        cadastroEncontrada: true,
        iconeCadastro: 'ico16negado.gif',
      },
      'capture-sucesso': { autorizado: true, comQuantidades: false },
      'capture-sem-senha': { autorizado: false, comQuantidades: false },
      'capture-nao-encontrada': { naoEncontrada: true },
    }

    document.querySelector('[name="Button_DoLogin"]').addEventListener('click', renderHome)

    function renderHome() {
      menu.style.display = 'block'
      menu.querySelector('#exames-abertos').onclick = (event) => {
        event.preventDefault()
        renderExamesAbertos()
      }
      const botaoNovoExame = menu.querySelector('#cadastro_biometria .MagnetoBigRoundedButton')
      botaoNovoExame.onclick = (event) => {
        event.preventDefault()
        abrirPopupNovoExame()
      }
      renderExamesAbertos()
    }

    // O clique real em "+ Novo Exame" abre uma popup de verdade (window.open)
    // — todo o caminho de cadastro/"Localizar Guia" roda dentro dela, igual
    // ao fixture de gerarGuia (ver portal-gerar-guia.html).
    function abrirPopupNovoExame() {
      const popup = window.open('about:blank', '_blank')
      popup.document.open()
      popup.document.write(popupCadastroHtml(scenario))
      popup.document.close()
    }

    function popupCadastroHtml(scenarioValue) {
      return `<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Fixture Unimed - Popup Novo Exame (status)</title></head>
<body>
  <main id="app"></main>
  <script>
    const scenario = ${JSON.stringify(scenarioValue)}
    const GUIA_EXISTENTE = ${JSON.stringify(GUIA_EXISTENTE)}
    const cfg = (${JSON.stringify(cenarios)})[scenario] || {}
    const app = document.querySelector('#app')

    function html(content) {
      app.innerHTML = content
      bind()
    }

    function processing(next) {
      app.insertAdjacentHTML('beforeend', '<div id="processing">Processando, por favor aguarde...</div>')
      setTimeout(() => {
        document.querySelector('#processing')?.remove()
        next()
      }, 20)
    }

    function bind() {
      document.querySelector('#ignora-cartao')?.addEventListener('click', (event) => {
        event.preventDefault()
        showCardStart()
      })
      document.querySelector('[data-beneficiary-option="intercambio"]')?.addEventListener('click', (event) => {
        event.preventDefault()
        showBeneficiaryForm()
      })
      document.querySelector('[name="Button_Insert"]')?.addEventListener('click', () => {
        processing(showUpdate)
      })
      document.querySelector('[name="Button_Update"]')?.addEventListener('click', () => processing(showLocalizarGuia))
      document.querySelector('[name="Button_Filtro"]')?.addEventListener('click', () => {
        const numero = document.querySelector('[name="s_NR_GUIA"]').value
        processing(() => showResultadoCadastro(numero))
      })
    }

    // Tela inicial da popup: "Passe o cartao..." com o link de problemas.
    html('<p>Passe o cartão...</p><a id="ignora-cartao" href="#">Se tiver problemas com o cartão, clique aqui.</a>')

    function showCardStart() {
      html(\`
        <p>Problemas com o cartão do beneficiário?</p>
        <a href="#" data-beneficiary-option="local">Beneficiário local sem cartão ou cartão não lê. Localize o beneficiário e prossiga com o atendimento.</a>
        <a href="#" data-beneficiary-option="intercambio">Beneficiário de intercâmbio sem cartão. Cadastre o beneficiário e prossiga com o atendimento.</a>
      \`)
    }

    function showBeneficiaryForm() {
      html(\`
        <input id="CD_UNIMED" name="CD_UNIMED">
        <input id="CD_CARTAO" name="CD_CARTAO">
        <input id="CD_BENEF" name="CD_BENEF">
        <input id="CD_DEPEN" name="CD_DEPEN">
        <input id="NR_DV" name="NR_DV">
        <button name="Button_Insert">Verificar</button>
      \`)
    }

    function showUpdate() {
      html('<h1>Atualização cadastral</h1><button name="Button_Update">Atualizar</button>')
    }

    function showLocalizarGuia() {
      html(\`
        <h1>Localizar Guia</h1>
        <input id="s_NR_GUIA" name="s_NR_GUIA">
        <button name="Button_Filtro">Localizar</button>
      \`)
    }

    function showResultadoCadastro(numero) {
      if (!cfg.cadastroEncontrada || numero !== GUIA_EXISTENTE) {
        html('<table><tr><td>0 exame(s) encontrado(s)</td></tr></table>')
        return
      }

      html(\`
        <table>
          <tr>
            <td>25/08/2026</td>
            <td>\${numero}</td>
            <td><img width="16" height="16" alt="" title="" src="/cmagnet/Themes/Magneto2014/\${cfg.iconeCadastro}"></td>
          </tr>
        </table>
      \`)
    }
  <\/script>
</body>
</html>`
    }

    // Confirmacao de guia incerta (busca por paciente, sem numero de guia
    // conhecido) usa uma listagem que ja aparece populada e paginada assim
    // que abre "Exames em aberto" — sem precisar preencher/filtrar
    // s_nr_guia. Confirmado ao vivo em producao em 26/08/2026 (11 paginas
    // varridas). Cenarios 'confirmar-*' modelam esse comportamento; os
    // demais mantem o fluxo por filtro exato ja existente.
    const CONFIRMAR_CARD_LAST6 = '654321'
    const CONFIRMAR_NUMERO_GUIA = 'UNI-999'

    function renderExamesAbertos() {
      if (scenario.startsWith('confirmar-')) {
        renderExamesAbertoListaSemFiltro(1)
        return
      }

      app.innerHTML = `
        <input name="s_nr_guia">
        <button name="Button_FIltro" type="button">Filtrar</button>
        <div id="resultado"></div>
      `
      document.querySelector('[name="Button_FIltro"]').addEventListener('click', () => {
        const numero = document.querySelector('[name="s_nr_guia"]').value
        renderResultado(numero)
      })
    }

    function renderExamesAbertoListaSemFiltro(pagina) {
      const linhasOutras = [
        '<tr><td>25/08/2026 10:00</td><td>OUTRO-1</td><td>Paciente Um 111111</td></tr>',
        '<tr><td>25/08/2026 10:05</td><td>OUTRO-2</td><td>Paciente Dois 222222</td></tr>',
      ]
      const linhaEncontrada = `<tr><td>26/08/2026 13:39</td><td><a href="#" data-open-confirmacao>${CONFIRMAR_NUMERO_GUIA}</a></td><td>Laura De Faveri ${CONFIRMAR_CARD_LAST6}</td></tr>`

      let linhas
      let temProxima

      if (scenario === 'confirmar-encontrada') {
        if (pagina === 1) {
          linhas = linhasOutras
          temProxima = true
        } else {
          linhas = [linhaEncontrada]
          temProxima = false
        }
      } else {
        linhas = pagina === 1
          ? linhasOutras
          : ['<tr><td>25/08/2026 11:00</td><td>OUTRO-3</td><td>Paciente Tres 333333</td></tr>']
        temProxima = pagina === 1
      }

      app.innerHTML = `
        <table>${linhas.join('')}</table>
        ${temProxima ? '<a href="#" data-next-page>Próxima</a>' : ''}
      `

      const proxima = app.querySelector('[data-next-page]')
      if (proxima) {
        proxima.addEventListener('click', (event) => {
          event.preventDefault()
          renderExamesAbertoListaSemFiltro(pagina + 1)
        })
      }

      const abrir = app.querySelector('[data-open-confirmacao]')
      if (abrir) {
        abrir.addEventListener('click', (event) => {
          event.preventDefault()
          renderExecucaoConfirmacao()
        })
      }
    }

    function renderExecucaoConfirmacao() {
      app.innerHTML = `
        <input name="NR_GUIA" value="${CONFIRMAR_NUMERO_GUIA}">
        <input name="DT_AUTORIZACAO" value="26/08/2026">
        <input name="NR_SENHA" value="8811223">
        <input name="DT_VALIDADE_SENHA" value="26/12/2026">
        <input name="QT_SOLIC_1" value="10">
        <input name="QT_AUTORIZADA_1" value="10">
      `
    }

    function renderResultado(numero) {
      const cfg = cenarios[scenario] ?? cenarios['status-approved']
      const resultado = document.querySelector('#resultado')

      if (cfg.naoEncontrada || numero !== GUIA_EXISTENTE) {
        resultado.innerHTML = '<table><tr><td>0 exame(s) encontrado(s)</td></tr></table>'
        return
      }

      resultado.innerHTML = `
        <table>
          <tr data-guia-row>
            <td>25/08/2026 13:53</td>
            <td><a href="#" data-open-guia>${numero}</a></td>
            <td>Paciente Teste</td>
          </tr>
        </table>
      `
      document.querySelector('[data-open-guia]').addEventListener('click', (event) => {
        event.preventDefault()
        renderExecucao(cfg)
      })
    }

    function renderExecucao(cfg) {
      const dtAutorizacao = cfg.autorizado ? '25/08/2026' : ''
      const nrSenha = cfg.autorizado ? '9248082' : ''
      const dtValidadeSenha = cfg.autorizado ? '24/10/2026' : ''
      const qtSolic = cfg.comQuantidades ? '10' : ''
      const qtAut = cfg.comQuantidades ? '6' : ''

      app.innerHTML = `
        <input name="NR_GUIA" value="${GUIA_EXISTENTE}">
        <input name="DT_AUTORIZACAO" value="${dtAutorizacao}">
        <input name="NR_SENHA" value="${nrSenha}">
        <input name="DT_VALIDADE_SENHA" value="${dtValidadeSenha}">
        <input name="QT_SOLIC_1" value="${qtSolic}">
        <input name="QT_AUTORIZADA_1" value="${qtAut}">
      `
    }
  </script>
</body>
</html>
